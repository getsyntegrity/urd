# PR CI. Goal: < 5 min. Single required check: "ci-ok".
# The Go version comes from .go-version (see go-setup). Nothing here pins it by hand.
#
# Tests in the docker/buildx style:
#   plan        -> what has to run (.github/scripts/impact): on a PR to develop or a hotfix, the root packages and
#                  the nested modules the change reaches, with their consumers, from the import graph of every
#                  module; a push to develop, the release PR and a manual run validate everything. It writes
#                  the plan to the job summary and the lanes ci-ok checks. Then it splits the selected
#                  packages into shards using real timings (.github/scripts/test-matrix.sh): regular packages
#                  go whole into TEST_SHARDS shards; a package slower than SPLIT_THRESHOLD is split by test
#                  into several shards, so one slow package cannot dominate the wall time
#   test (N)    -> each shard on its own runner, in parallel; the TestCluster* tests (cluster job) and the
#                  TestArchitecture* tests (architecture job) are skipped
#   test-report -> merges coverage, publishes the slowest tests, stores timings for the next run
#   test (min)  -> builds and vets with the minimum Go (every PR); on a PR to main it also runs the tests with
#                  it, TestArchitecture* excluded (the architecture job runs those with the minimum Go there)
#   modules     -> build, vet and test of every nested module (persistence/postgres, publishers, compat,
#                  example, which also holds example/cluster); inttest and benchmark are only built and vetted here, their
#                  tests run in their own jobs. The examples are compiled, never run
#   inttest     -> the integration tests of the inttest module, on real containers (Testcontainers):
#                  every push to develop (each merge), the develop -> main release PR and workflow_dispatch;
#                  never on feature or hotfix PRs
#   benchmark   -> every benchmark of the benchmark module once (-benchtime=1x; a manual run can choose a
#                  longer benchtime), same triggers as inttest; fails if no benchmark ran
#   architecture-> the TestArchitecture* tests (go list and source scans that enforce the dependency boundaries,
#                  #208) of the packages the plan selected, in every module that has them, the four publishers
#                  included; every one of them on a full run. No -race, no coverage, -count=1; fails if an
#                  expected test did not pass (a run that executed none included). Go: the minimum of go.mod
#                  on a PR to main (release and hotfix, where test (min) used to run them), .go-version otherwise
#   cluster     -> every TestCluster* test of the root module, alone (the shards skip them); same triggers as
#                  inttest (push to develop, release PR develop -> main, manual); fails if no TestCluster* test passed
#   race        -> the selected root packages (the whole module on a full run) under -race, TestCluster* and
#                  TestArchitecture* skipped; same scope as the test shards
#   unit-gate   -> the unit-test rules of #204 (no testify, no generated mocks, go-specs, no real resources)
#                  plus the no-skip rule for inttest/
#   ci-ok       -> the one required check: compares every job with the plan; a job the plan requires that did
#                  not succeed (a skipped one included) fails it
name: ci

on:
  # push to develop: validates the real result of the merge (like buildx with master)
  # and stores the test timings that PRs use to split the shards.
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]
    # labeled/unlabeled: recomputes the version when the release:* labels change
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      benchtime:
        description: "go test -benchtime for the benchmark job (1x = every benchmark once; e.g. 2s for a real measurement)"
        required: false
        default: "1x"

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read   # golangci-lint only-new-issues

env:
  COVERAGE_MIN: "0"       # minimum total coverage %. 0 = report only. Raise it once there is a baseline.
  TEST_SHARDS: "2"        # parallel runners for the regular (not split) packages. 1 = no shards.
  SPLIT_THRESHOLD: "90"   # seconds. A package slower than this (by real timings) is split by test.
  SPLIT_TARGET: "90"      # seconds. Aimed duration of each shard of a split package.
  TESTFLAGS: "-timeout=20m"
  # Top-level tests that start a multi-node cluster (named TestCluster*, see docs/ci.md). The test shards and
  # the race job skip them (-skip), the cluster job runs only them (-run), and test-matrix.sh leaves them
  # out of the lists it distributes. (test (min) on the release PR also runs them, with the minimum Go.)
  CLUSTER_TESTS: "^TestCluster"
  # Top-level tests that enforce a dependency boundary with `go list` or a source scan (named TestArchitecture*,
  # see docs/ci.md and docs/testing/architecture-tests.md). The shards, the race job and the modules job skip
  # them, and so does test (min) (-skip "$CLUSTER_TESTS|$ARCHITECTURE_TESTS" or -skip "$ARCHITECTURE_TESTS"); the
  # architecture job is the only one that runs them, without -race or coverage, with the minimum Go on a PR to main.
  ARCHITECTURE_TESTS: "^TestArchitecture"
  GOTESTSUM_VERSION: "v1.13.0"

jobs:
  flow:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      BASE: ${{ github.base_ref }}
      HEAD: ${{ github.head_ref }}
      LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
    steps:
      - name: Only develop or hotfix/* may target main
        run: |
          if [ "$BASE" = "main" ] && [ "$HEAD" != "develop" ] && [[ "$HEAD" != hotfix/* ]]; then
            echo "::error::Only PRs from develop or hotfix/* may target main (source: $HEAD)"
            exit 1
          fi
      - if: github.base_ref == 'main'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Fails HERE (before the merge) if the bump cannot be published, e.g. a major
      # without updating the /vN path in go.mod.
      - if: github.base_ref == 'main'
        name: Version to publish
        run: |
          out=$(.github/scripts/next-version.sh "$HEAD" "$LABELS")
          echo "$out"
          v=$(sed -n 's/^version=//p' <<<"$out"); prev=$(sed -n 's/^previous=//p' <<<"$out")
          echo "### Merging this PR publishes **${v}** (previous: ${prev})" >> "$GITHUB_STEP_SUMMARY"

  lint:
    if: github.event_name == 'pull_request'   # not on develop: it would block on inherited issues
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go-setup
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0      # built with Go 1.27: when bumping the Go minor, check that it supports it
          # Gradual adoption: on PRs it only blocks NEW issues in the diff.
          # Once the code base is clean, set it to false.
          only-new-issues: ${{ github.event_name == 'pull_request' }}

  # ── Tests ────────────────────────────────────────────────────────
  # The plan (.github/scripts/impact, issue #209) decides what runs. For a pull request to develop or a hotfix
  # to main it reads the files the PR changed, builds the import graph of every module (production and test
  # imports, across modules) and selects the root packages and the nested modules the change reaches, with
  # their consumers. A push to develop, the release PR and a manual run validate everything, with no second
  # partial selection next to it. A change it cannot narrow (toolchain, generation, shared tooling, a new module,
  # a deleted or renamed path) widens to the full scope, and an error of the selector fails this job; none of
  # them can end in a green run that did less than it should. Its outputs drive the jobs below, and ci-ok
  # compares every job result with them: a job the plan requires that did not succeed fails the gate.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      lanes: ${{ steps.impact.outputs.lanes }}
      modules: ${{ steps.impact.outputs.modules }}
      race_packages: ${{ steps.impact.outputs.race_packages }}
      architecture: ${{ steps.impact.outputs.architecture }}
      matrix: ${{ steps.matrix.outputs.matrix || '{"include":[{"id":0,"packages":"./...","run":""}]}' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0     # the diff needs the merge base with the base branch
      - uses: ./.github/actions/go-setup
      # The files this PR changes: the three-dot diff is taken from the merge base with the base branch, not
      # from the current tip of it, so what other PRs merged meanwhile is not counted as this PR's change.
      - name: Files changed by the pull request
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git rev-parse --verify --quiet "origin/$BASE^{commit}" >/dev/null || { echo "::error::base branch origin/$BASE is not available"; exit 1; }
          git rev-parse --verify --quiet "$HEAD_SHA^{commit}" >/dev/null || { echo "::error::head commit $HEAD_SHA is not available"; exit 1; }
          git diff --name-status -M -z "origin/$BASE...$HEAD_SHA" > "$RUNNER_TEMP/changes.z"
          echo "Changed paths: $(tr -cd '\0' < "$RUNNER_TEMP/changes.z" | wc -c) fields"
      # The selector decides what every other job runs, and nothing else in the workflow runs its tests.
      - name: Selector tests
        run: go test -count=1 ./.github/scripts/impact
      - name: Impact plan
        id: impact
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          args=(-event "$EVENT" -base-ref "$BASE" -head-ref "$HEAD"
                -plan-out "$RUNNER_TEMP/impact-plan.json" -summary-out "$RUNNER_TEMP/impact-summary.md"
                -packages-out "$RUNNER_TEMP/packages.txt" -github-output "$GITHUB_OUTPUT")
          [ "$EVENT" != pull_request ] || args+=(-changes "$RUNNER_TEMP/changes.z")
          go run ./.github/scripts/impact plan "${args[@]}" > /dev/null
          cat "$RUNNER_TEMP/impact-summary.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: impact-plan
          path: ${{ runner.temp }}/impact-plan.json
          retention-days: 14
      - if: fromJSON(steps.impact.outputs.lanes).test
        uses: actions/cache/restore@v6
        with:
          path: .test-timings
          key: test-timings-${{ github.run_id }}
          restore-keys: test-timings-
      - name: Split packages into shards
        id: matrix
        if: fromJSON(steps.impact.outputs.lanes).test
        run: |
          go install "gotest.tools/gotestsum@${GOTESTSUM_VERSION}"
          mkdir -p .test-timings
          echo "Timings available: $(ls .test-timings | wc -l) file(s)"
          # A selective plan wrote the packages to run; a full one wrote nothing and every package is planned.
          if [ -s "$RUNNER_TEMP/packages.txt" ]; then export PACKAGES_FILE="$RUNNER_TEMP/packages.txt"; fi
          matrix=$(.github/scripts/test-matrix.sh)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          {
            echo "### Test shards"
            echo "| Shard | Estimated | Packages | Tests |"
            echo "|---|---|---|---|"
            jq -r '.include[] | "| \(.id) | \(.estimatedRuntime) | \(.packages | split(" ") | length) | \(if .run == "" then "all" else "\(.run | split("|") | length) (split)" end) |"' <<<"$matrix"
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: test (shard ${{ matrix.id }})
    needs: plan
    if: needs.plan.result == 'success' && fromJSON(needs.plan.outputs.lanes).test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false            # let every shard report, like buildx
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go-setup
      - run: go install "gotest.tools/gotestsum@${GOTESTSUM_VERSION}"
      - name: Tests
        env:
          PACKAGES: ${{ matrix.packages }}
          ID: ${{ matrix.id }}
          RUN: ${{ matrix.run }}   # regex of top-level tests when the package is split; empty = all
        run: |
          mkdir -p reports
          args=()
          [ -z "$RUN" ] || args+=(-run "$RUN")
          # -run selects the share of a split package and -skip removes the cluster and architecture tests
          # from it; both apply at once. They run in the cluster and architecture jobs.
          args+=(-skip "$CLUSTER_TESTS|$ARCHITECTURE_TESTS")
          # shellcheck disable=SC2086  # PACKAGES is a space-separated list
          gotestsum --format github-actions \
            --jsonfile "reports/test-$ID.json" --junitfile "reports/junit-$ID.xml" \
            -- $TESTFLAGS "${args[@]}" -covermode=atomic -coverprofile="reports/coverage-$ID.out" $PACKAGES
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-report-${{ matrix.id }}
          path: reports/
          retention-days: 7
          if-no-files-found: ignore

  test-report:
    needs: [plan, test]
    if: ${{ !cancelled() && needs.plan.result == 'success' && fromJSON(needs.plan.outputs.lanes)['test-report'] }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go-setup
      - uses: actions/download-artifact@v8
        with:
          pattern: test-report-*
          path: reports
          merge-multiple: true
      - name: Coverage and slowest tests
        run: |
          go install "gotest.tools/gotestsum@${GOTESTSUM_VERSION}"
          ls reports/coverage-*.out >/dev/null 2>&1 || { echo "::error::No shard produced coverage"; exit 1; }
          # A split package has one profile per shard with the same blocks: `go tool cover`
          # sums the counts of duplicated blocks, so plain concatenation is enough.
          { echo "mode: atomic"; tail -q -n +2 reports/coverage-*.out; } > coverage.out
          go tool cover -html=coverage.out -o coverage.html
          total=$(go tool cover -func=coverage.out | awk '/^total:/ { sub("%", "", $3); print $3 }')
          {
            echo "### Coverage: **${total}%** (required minimum: ${COVERAGE_MIN}%)"
            echo
            echo "### Slowest tests (> 1s)"
            echo '```'
            cat reports/test-*.json | gotestsum tool slowest --threshold 1s | head -25
            echo '```'
            echo "<details><summary>Coverage by function</summary>"
            echo
            echo '```'
            go tool cover -func=coverage.out
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          if awk -v t="$total" -v m="$COVERAGE_MIN" 'BEGIN { exit !(t < m) }'; then
            echo "::error::Coverage ${total}% is below the minimum ${COVERAGE_MIN}%"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage.out
            coverage.html
          retention-days: 14
      # Timings to split the shards better on the next run.
      # Saved from develop (visible to every PR) and from each PR (for its re-runs).
      - name: Save timings
        # Only this run's files: test-matrix.sh sums the package times across files.
        run: rm -rf .test-timings && mkdir -p .test-timings && cp reports/test-*.json .test-timings/
      - uses: actions/cache/save@v6
        with:
          path: .test-timings
          key: test-timings-${{ github.run_id }}

  # Minimum version the library promises (the go directive of go.mod).
  #   PR to develop: build and vet (fast; detects use of newer stdlib API).
  #   PR to main:    the release PR (from develop) runs the tests with the minimum before publishing, the
  #                  TestCluster tests included; a hotfix PR skips the TestCluster tests. Both skip the
  #                  TestArchitecture tests: the architecture job runs them with the same minimum Go on those two
  #                  events (the nested publisher modules too, which this job never reached), so they are not
  #                  run twice and the minimum-Go validation of them is kept.
  # Uses plain `go test`: gotestsum 1.13 needs Go >= 1.24 and the minimum may be lower.
  # On the release PR it does NOT skip the TestCluster tests, on purpose: it is the only job that runs them
  # with the minimum Go. (The cluster job runs them with the toolchain of .go-version.)
  test-min:
    name: test (min)
    needs: plan
    if: needs.plan.result == 'success' && fromJSON(needs.plan.outputs.lanes)['test-min']
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Minimum version from go.mod
        id: min
        run: |
          echo "version=$(awk '$1 == "go" { print $2; exit }' go.mod)" >> "$GITHUB_OUTPUT"
          # Without this, the "toolchain" line of go.mod would make Go upgrade itself to the SDK.
          echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
      - uses: ./.github/actions/go-setup
        with:
          go-version: ${{ steps.min.outputs.version }}
      - run: go build ./... && go vet ./...
      # The release PR (develop -> main) runs everything with the minimum Go, TestCluster* included. A hotfix
      # PR to main skips them, like a feature PR: the cluster lane covers them after the merge. Neither runs
      # TestArchitecture*: the architecture job does, with the same minimum Go.
      - if: github.base_ref == 'main' && github.head_ref == 'develop'
        run: go test $TESTFLAGS -skip "$ARCHITECTURE_TESTS" ./...
      - if: github.base_ref == 'main' && github.head_ref != 'develop'
        run: go test $TESTFLAGS -skip "$CLUSTER_TESTS|$ARCHITECTURE_TESTS" ./...

  # Nested modules (benchmark, persistence/postgres, publisher/*, test/compat, example (all the examples,
  # example/cluster included), inttest) are separate Go modules: `./...` at the root does not reach them, so each one is built, vetted
  # and tested on its own. The plan lists them, found from their go.mod, in the modules output: on a pull
  # request only the ones the change reaches (a module is reached when it, or a package it imports in the same
  # or another module, changed); on a push to develop, the release PR and a manual run, all of them. No race
  # detector. The examples are only compiled and vetted, never executed, so a change that breaks one fails
  # before the merge. inttest and benchmark are built and vetted only (go vet compiles their test files):
  # their tests run in the inttest and benchmark jobs, after the merge.
  modules:
    name: modules (${{ matrix.dir }})
    needs: plan
    if: needs.plan.result == 'success' && fromJSON(needs.plan.outputs.lanes).modules
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      # Every nested module the plan selected, found from its go.mod: dir, and "yes" for the ones that only
      # build and vet (inttest, benchmark), a string flag because an absent matrix key is null.
      matrix: ${{ fromJSON(needs.plan.outputs.modules) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go-setup
      - name: Build and vet
        working-directory: ${{ matrix.dir }}
        run: |
          go build ./...
          go vet ./...
      - name: Test
        if: matrix.vet-only != 'yes'
        working-directory: ${{ matrix.dir }}
        run: go test $TESTFLAGS -skip "$ARCHITECTURE_TESTS" ./...

  # Integration tests: the inttest module starts its own containers with Testcontainers (Docker is already
  # on ubuntu-latest), so there are no services: and no DSN variables. A missing Docker fails the job, a test
  # under inttest/ never skips (the no-skip rule of unit-gate). It runs on every push to develop (the result
  # of each merge), on the develop -> main release PR (the gate that keeps main from receiving a red
  # integration run, through ci-ok) and on manual runs. Feature and hotfix PRs never run it; a hotfix is
  # covered once its main -> develop sync PR is merged and develop is pushed. ci-ok accepts "skipped".
  inttest:
    needs: plan
    if: needs.plan.result == 'success' && fromJSON(needs.plan.outputs.lanes).inttest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go-setup
      - name: Integration tests
        working-directory: inttest
        run: go test -count=1 -timeout=15m ./...

  # The benchmarks of the benchmark module. The module has no Test functions, only Benchmark ones, which
  # start a real in-process goakt actor system, so plain `go test` would compile them and run nothing.
  # They follow the inttest rule: compiled and vetted on every pull request by modules, executed only
  # after the merge (push to develop), on the develop -> main release PR and on manual runs. Automatic runs
  # use -benchtime=1x (every benchmark once, about two minutes) to prove they still run; a manual run can
  # pass a longer benchtime for a real measurement. The step fails if no benchmark reported a result.
  benchmark:
    needs: plan
    if: needs.plan.result == 'success' && fromJSON(needs.plan.outputs.lanes).benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go-setup
      - name: Run every benchmark
        working-directory: benchmark
        shell: bash
        env:
          BENCHTIME: ${{ inputs.benchtime || '1x' }}
        run: |
          out="$RUNNER_TEMP/benchmark.txt"
          go test -count=1 -timeout=20m -run '^$' -bench . -benchtime="$BENCHTIME" ./... | tee "$out"
          n=$(grep -cE '^Benchmark[^[:space:]]+[[:space:]]+[0-9]+' "$out" || true)
          {
            echo "### Benchmarks (benchtime $BENCHTIME): $n results"
            echo '```'
            grep -E '^Benchmark' "$out" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$n" -eq 0 ]; then
            echo "::error::no benchmark reported a result"
            exit 1
          fi
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: ${{ runner.temp }}/benchmark.txt
          retention-days: 14
          if-no-files-found: ignore

  # The multi-node cluster tests: every top-level test named TestCluster* in the root module. They start real
  # clustered actor systems on loopback ports, so the test shards skip them (-skip) and they run here, alone.
  # They follow the inttest rule: they run on every push to develop (the result of each merge), on the
  # develop -> main release PR (so main never receives a red cluster run, through ci-ok) and on manual runs.
  # Feature and hotfix PRs never run them; a hotfix is covered once its main -> develop sync PR is merged and
  # develop is pushed. They are in-process (no Docker). ci-ok accepts "skipped". The command takes
  # ./... on purpose. A hardcoded package list would let a new TestCluster* in another package be skipped by
  # the shards and never run here, and the zero-pass guard would not notice while other packages still pass.
  # `go test` reports "no tests to run" as a pass, so the step counts the top-level TestCluster* pass events in
  # the -json output and fails if there is none (a rename that left the lane empty would otherwise stay
  # green). No retries: a flaky cluster test is fixed in its own PR.
  cluster:
    needs: plan
    if: needs.plan.result == 'success' && fromJSON(needs.plan.outputs.lanes).cluster
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go-setup
      - name: Cluster tests
        shell: bash
        run: |
          out="$RUNNER_TEMP/cluster.json"
          status=0
          go test -count=1 -timeout=8m -run "$CLUSTER_TESTS" -json ./... > "$out" || status=$?
          # Top-level tests only (no "/" in the name) that passed.
          passed=$(jq -Rr --arg re "$CLUSTER_TESTS" 'fromjson? | select(.Action == "pass" and .Test != null and (.Test | contains("/") | not) and (.Test | test($re))) | .Test' "$out" | sort -u)
          n=$(printf '%s' "$passed" | grep -c . || true)
          {
            echo "### Cluster tests: $n top-level tests passed (go test exit status $status)"
            echo '```'
            echo "$passed"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$n top-level $CLUSTER_TESTS tests passed (go test exit status $status)"
          if [ "$status" -ne 0 ]; then
            echo "::error::go test failed in the cluster lane (exit status $status)"
            exit 1
          fi
          if [ "$n" -eq 0 ]; then
            echo "::error::the cluster lane ran no top-level $CLUSTER_TESTS test"
            exit 1
          fi
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: cluster-results
          path: ${{ runner.temp }}/cluster.json
          retention-days: 14
          if-no-files-found: ignore

  # The architecture tests (#208): the top-level TestArchitecture* tests of every module. They resolve the import
  # graph with `go list` subprocesses and scan the sources, so -race and coverage only slow them down; the
  # shards, the race job and the modules job skip them and this job runs them, with -count=1 so a cached result
  # never stands in. The plan chooses them (.github/scripts/impact): the packages the change reaches through
  # the import graph and, because the graph cannot see a boundary that is a new import in a package the test does
  # not import, the source-reading packages whenever a production Go file changed; every one of them on a push
  # to develop, the release PR and a manual run. The nested modules (the four publishers) run from their own
  # directory. Go version: on a pull request to main (the release PR and a hotfix, the events where test (min)
  # used to run these tests) the minimum of the root go.mod, with no GOTOOLCHAIN=local, so a module whose own go
  # directive is higher (publisher/pulsar, 1.26.2) runs with the minimum it declares; on every other event the
  # version of .go-version. Each test runs once per event, not once per Go version, and the summary names the
  # toolchain of every module. `go test` reports "no tests to run" as a pass, so the command checks that every test the plan
  # expected has a pass event, and fails otherwise (a run that executed none included). ci-ok requires it
  # whenever the plan does: a skipped architecture job fails the gate.
  architecture:
    needs: plan
    if: needs.plan.result == 'success' && fromJSON(needs.plan.outputs.lanes).architecture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Minimum Go from go.mod
        id: min
        if: github.base_ref == 'main'
        run: echo "version=$(awk '$1 == "go" { print $2; exit }' go.mod)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/go-setup
        with:
          go-version: ${{ steps.min.outputs.version }}   # empty (so .go-version) when the step above was skipped
      - name: Architecture tests
        shell: bash
        env:
          ARCHITECTURE: ${{ needs.plan.outputs.architecture }}
        run: |
          status=0
          go run ./.github/scripts/impact architecture -out "$RUNNER_TEMP/architecture" > "$RUNNER_TEMP/architecture.md" || status=$?
          cat "$RUNNER_TEMP/architecture.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: architecture-results
          path: ${{ runner.temp }}/architecture/
          retention-days: 14
          if-no-files-found: ignore

  # The root module under the race detector (#206), TestCluster* and TestArchitecture* skipped: they are not run under -race
  # yet (out of scope for #206, a follow-up once the in-process suites are known to be race-free). Its triggers
  # are those of the unit shards; its scope is the plan's: the selected packages on a pull request, the whole
  # module on a push to develop, the release PR and a manual run. A race
  # found here is fixed in its own pull request, never by silencing the job. No retries. A package with a
  # known race is excluded only via an explicit list here with a linked issue and exit condition, never
  # silently, never with retries. The race detector is never run locally.
  race:
    needs: plan
    if: needs.plan.result == 'success' && fromJSON(needs.plan.outputs.lanes).race
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go-setup
      - name: Race detector
        env:
          PACKAGES: ${{ needs.plan.outputs.race_packages }}   # ./... on a full run, else the selected packages
        run: |
          # shellcheck disable=SC2086  # PACKAGES is a space-separated list
          go test -race -count=1 -timeout=8m -skip "$CLUSTER_TESTS|$ARCHITECTURE_TESTS" $PACKAGES

  # Unit-test rules of #204 over every Go file of every module (docs/testing/go-specs.md, "The unit-test gate").
  # Cheap and independent of the test shards, so it runs even when the plan skips the tests.
  unit-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go-setup
      - name: The gate's own tests
        run: go test ./.github/scripts/unitgate
      - name: Scan the repository
        # The pending list is empty, so stale entries are errors.
        run: go run ./.github/scripts/unitgate -strict

  # go.mod/go.sum sorted, for the root module and every nested module (a cheap job of its own).
  tidy:
    needs: plan
    if: needs.plan.result == 'success' && fromJSON(needs.plan.outputs.lanes).tidy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go-setup
      - run: |
          status=0
          while IFS= read -r mod; do
            dir=$(dirname "$mod")
            (cd "$dir" && go mod tidy)
            if ! git diff --exit-code -- "$mod" "${mod%go.mod}go.sum"; then
              echo "::error::Run 'go mod tidy' in '$dir' and commit the result"
              status=1
            fi
          done < <(git ls-files 'go.mod' '**/go.mod')
          exit "$status"

  # Changes in the public API (apidiff).
  #   PR to develop: compares against develop -> informs (warning if it breaks the API).
  #   PR to main:    compares against the latest tag -> BLOCKS if it breaks the API without release:major.
  api:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE: ${{ github.base_ref }}
      HEAD: ${{ github.head_ref }}
      LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/go-setup
      - name: Install apidiff
        run: |
          go install golang.org/x/exp/cmd/apidiff@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Compare API
        run: |
          if [ "$BASE" = "main" ]; then
            ref=$(git tag --merged HEAD --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
            if [ -z "$ref" ]; then echo "First release: nothing to compare against"; exit 0; fi
            bump=$(.github/scripts/next-version.sh "$HEAD" "$LABELS" 2>/dev/null | sed -n 's/^bump=//p' || true)
            if [ -z "$bump" ]; then
              echo "::notice::Could not compute the bump (the error is in the flow job, e.g. /vN missing in go.mod). Reporting without blocking."
            fi
          else
            ref="origin/$BASE"; bump=""
          fi
          .github/scripts/api-check.sh "$ref" "$bump"

  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go-setup
      # Fails only if the code CALLS something vulnerable. Strict mode is in security.yml.
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # The single required check. It does not accept any "skipped": it compares every job with the plan (lanes
  # output of the plan job, rules in .github/scripts/impact/plan.go). A job the plan requires must have
  # succeeded; a skipped one fails, so a broken condition cannot turn a missing lane green. A job the plan
  # leaves out may be skipped. A new check in the future = add the job, list it here and give it a rule in
  # the planner; the gate fails on a job it does not know. Branch protection is not touched.
  ci-ok:
    if: always()
    needs: [flow, lint, plan, test, test-report, test-min, modules, inttest, benchmark, cluster, architecture, race, unit-gate, tidy, api, vuln]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go-setup
      - name: Compare the results with the plan
        env:
          NEEDS: ${{ toJSON(needs) }}
          LANES: ${{ needs.plan.outputs.lanes }}
        run: go run ./.github/scripts/impact gate
