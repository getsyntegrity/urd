    status: done
    branch: feat/adopt-kit-logger
    pull_request: https://github.com/pablogore/ego/pull/6
    commits: [dc900ad, b9381b1]
    summary: >
      logger.go rewritten as a thin kitlog.Logger -> GoAkt log.Logger adapter;
