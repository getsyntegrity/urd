syntax = "proto3";

package egopb;

import "google/protobuf/any.proto";

option go_package = "github.com/getsyntegrity/urd/egopb;egopb";

// Event defines the event that needs to be persisted onto the events store
message Event {
  // Specifies the persistence unique identifier
  string persistence_id = 1;
  // Specifies the sequence number
  uint64 sequence_number = 2;
  // Specifies the deletion state
  bool is_deleted = 3;
  // the event emitted
  google.protobuf.Any event = 4;
  // field 5 was resulting_state, now persisted separately in the snapshot store
  reserved 5;
  // Specifies the timestamp
  int64 timestamp = 6;
  // Specifies the shard number
  uint64 shard = 7;
  // Specifies the encryption key ID used to encrypt the event payload.
  // Empty when the event is not encrypted.
  string encryption_key_id = 8;
  // When true, the event payload is encrypted.
  bool is_encrypted = 9;
  // Carries the tenant identity attached when this event was persisted,
  // serialized via tenancy.MarshalMetadata's ego.tenant.* keys (EGO-TENANT-002).
  // Empty when tenancy is not in use.
  map<string, string> tenant_metadata = 10;
}

// CommandReply specifies the reply to a command sent to
// the aggregate
message CommandReply {
  // the actual command reply
  oneof reply {
    // actual state is wrapped with metadata
    StateReply state_reply = 1;
    // gRPC failure
    ErrorReply error_reply = 2;
  }
}

// StateReply is a command reply.
// This is reply is used when there is a no-op
message StateReply {
  // Specifies the persistence unique identifier
  string persistence_id = 1;
  // the entity state
  google.protobuf.Any state = 2;
  // Specifies the sequence number
  uint64 sequence_number = 3;
  // Specifies the timestamp
  int64 timestamp = 4;
  // Specifies the saga lifecycle status. Only a saga actor sets it, in its
  // reply to GetStateCommand; every other reply leaves it at
  // SAGA_LIFECYCLE_STATUS_NONE.
  SagaLifecycleStatus saga_status = 5;
}

// SagaLifecycleStatus is the lifecycle status a saga actor reports in its
// StateReply. It mirrors ego.SagaStatus; SAGA_LIFECYCLE_STATUS_NONE means the
// replier did not report one (a non-saga reply, or a saga node built before
// this field existed) and is read as running. A reader maps any value it does
// not know to SagaRunning, so a value added later must be safe to read as
// running on older nodes.
enum SagaLifecycleStatus {
  // No lifecycle status was reported.
  SAGA_LIFECYCLE_STATUS_NONE = 0;
  // The saga is actively processing.
  SAGA_LIFECYCLE_STATUS_RUNNING = 1;
  // The saga finished successfully, or its compensation succeeded.
  SAGA_LIFECYCLE_STATUS_COMPLETED = 2;
  // The saga is rolling back.
  SAGA_LIFECYCLE_STATUS_COMPENSATING = 3;
  // The saga failed and its compensation also failed.
  SAGA_LIFECYCLE_STATUS_FAILED = 4;
}

// ErrorReply is used when a command processing has
// failed.
message ErrorReply {
  // Specifies the error message
  string message = 1;
}

// NoReply is used when a command does not need a reply
message NoReply {}

// GetStateCommand tells the Aggregate
// to reply with its latest state
message GetStateCommand {}

// TenantBindingQuery is an engine-internal control message, never a
// command: Engine.Entity, DurableStateEntity, and Saga send it to the actor
// a tenant-aware spawn returned (local or on another node) to learn whether
// that actor is bound to tenant_id. The actor answers from its own spawn
// binding without running business behavior, resolving a tenant, or
// touching a store. Engine.Dispatch rejects it as a payload.
message TenantBindingQuery {
  // tenant_id is the tenant the spawn declared.
  string tenant_id = 1;
}

// TenantBindingReply answers a TenantBindingQuery. It never discloses which
// tenant the actor is bound to, only whether it is the queried one.
message TenantBindingReply {
  // tenant_aware is true when the actor runs in tenant-aware mode and holds
  // a tenant binding.
  bool tenant_aware = 1;
  // matches is true when that binding is exactly the queried tenant.
  bool matches = 2;
}

// ActorBindingQuery verifies the identity of the PID returned by a spawn.
// These fields are compared by the actor against its immutable binding.
message ActorBindingQuery {
  bool tenant_aware = 1;
  string tenant_id = 2;
  string family = 3;
  string definition = 4;
  string namespace = 5;
}

// ActorBindingReply reveals only whether the requested identity matches.
message ActorBindingReply {
  bool matches = 1;
}

// Offset defines the projection offset
message Offset {
  // Specifies the shard number
  uint64 shard_number = 1;
  // Specifies the projection name.
  string projection_name = 2;
  // Specifies the value
  int64 value = 3;
  // Specifies the timestamp
  int64 timestamp = 5;
}

// ProjectionId defines the projection id
message ProjectionId {
  // Specifies the projection name
  string projection_name = 1;
  // Specifies the shard number
  uint64 shard_number = 2;
}

// Snapshot defines a point-in-time snapshot of an event-sourced entity's state.
// Snapshots are persisted separately from events and are used to speed up recovery
// by avoiding full event replay.
message Snapshot {
  // Specifies the persistence unique identifier
  string persistence_id = 1;
  // Specifies the sequence number of the event at which this snapshot was taken
  uint64 sequence_number = 2;
  // the entity state at the time of the snapshot
  google.protobuf.Any state = 3;
  // Specifies the timestamp
  int64 timestamp = 4;
  // Specifies the encryption key ID used to encrypt the snapshot state.
  // Empty when the snapshot is not encrypted.
  string encryption_key_id = 5;
  // When true, the snapshot state is encrypted.
  bool is_encrypted = 6;
  // Carries the tenant identity attached when this snapshot was taken,
  // serialized via tenancy.MarshalMetadata's ego.tenant.* keys (EGO-TENANT-002).
  // Empty when tenancy is not in use.
  map<string, string> tenant_metadata = 7;
}

// DurableState defines the durable state behavior
// actor
message DurableState {
  // Specifies the persistence unique identifier
  string persistence_id = 1;
  // Specifies the version number
  uint64 version_number = 2;
  // the state obtained from processing a command
  google.protobuf.Any resulting_state = 3;
  // Specifies the timestamp
  int64 timestamp = 5;
  // Specifies the shard number
  uint64 shard = 6;
  // Carries the tenant identity attached when this state was persisted,
  // serialized via tenancy.MarshalMetadata's ego.tenant.* keys (EGO-TENANT-002).
  // Empty when tenancy is not in use.
  map<string, string> tenant_metadata = 7;
}
